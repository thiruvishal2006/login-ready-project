<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Details — Project Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <header class="masthead">
    <span class="mark">Project Portal</span>
    <span class="user-bar">
      <span id="welcome-text"></span>
      <button type="button" class="secondary" id="logout-btn">Log out</button>
    </span>
  </header>

  <main class="page-wrap">
    <h1>Project details</h1>
    <p class="lede">Fill in your project information. Module entry fields appear automatically once you enter the number of modules.</p>

    <form id="project-form" novalidate>

      <div class="section">
        <h2>Overview</h2>

        <label for="title">Project Title</label>
        <input type="text" id="title" required>

        <label for="abstract">Abstract</label>
        <textarea id="abstract" required></textarea>

        <label for="description">Project Description</label>
        <textarea id="description" required></textarea>

        <label for="literature">Literature Survey</label>
        <textarea id="literature" required></textarea>

        <label for="other-details">Other Relevant Details (optional)</label>
        <textarea id="other-details"></textarea>
      </div>

      <div class="section">
        <h2>Modules</h2>

        <label for="module-count">Number of Modules</label>
        <input type="number" id="module-count" min="1" max="20" required>
        <p id="modules-hint">Enter a number above to generate that many module entry fields.</p>

        <div id="modules-container"></div>
      </div>

      <div class="submit-row">
        <button type="submit">Submit &amp; Generate PDF Report</button>
      </div>
    </form>
  </main>

  <p class="credits">Developed by R.S. Thiru Vishal · K.B. Naveen · Y. Saran</p>

  <script src="js/form.js"></script>
</body>
</html>
